# =========================================================
# AntiHitbox — cau hinh
# =========================================================

reach:
  survival: 3.0
  creative: 6.0
  use-attribute: true

tolerance:
  base: 0.10
  per-ping-ms: 0.0015
  max-ping: 300
  victim-margin: 0.05

history:
  enabled: true
  size: 40

# =========================================================
# MOI: chan danh xuyen block
# =========================================================
occlusion:
  # Bat/tat kiem tra block chan giua mat attacker va victim.
  enabled: true
  # Bo qua cac block "passable" nhu co, bien quang cao, hoa, chat long.
  # BAT BUOC de true trong PvP thuc te, neu khong se cancel oan.
  ignore-passable: true
  # Sai so (block) khi so sanh khoang cach block-hit vs entity-hit.
  epsilon: 0.01

debug:
  log-cancelled: false
